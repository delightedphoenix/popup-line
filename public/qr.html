<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Lexie Wilcox Photography pop-up — QR code</title>
  <meta name="description" content="Lexie Wilcox Photography pop-up. QR code to join the line.">
  <style>
    :root {
      --paper: #fdf6ec;
      --paper-deep: #f6e6d0;
      --ink: #2a2018;
      --accent: #b4562a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, #fff9f0 0%, transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 30rem;
    }

    .name {
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }

    .scan-heading {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      font-weight: bold;
      line-height: 1.2;
      margin-top: 10px;
    }

    .qr-box {
      width: min(75vw, 320px);
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      margin: 24px auto 0;
      line-height: 0;
    }

    .qr-box svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .join-url {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 15px;
      color: var(--ink);
      margin-top: 16px;
      word-break: break-all;
    }

    .qr-error {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #7a2c12;
      padding: 16px 0;
    }

    .print-btn {
      width: 100%;
      height: 56px;
      margin-top: 24px;
      font-family: Verdana, Geneva, sans-serif;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.02em;
      color: var(--ink);
      background: transparent;
      border: 2px solid var(--ink);
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease;
    }

    .print-btn:hover,
    .print-btn:active {
      background: var(--paper-deep);
    }

    .print-btn:focus {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    @page {
      size: letter;
      margin: 0.75in;
    }

    @media print {
      body {
        background: #fff;
        color: #000;
        display: block;
        padding: 0;
      }

      .print-btn {
        display: none;
      }

      .qr-box {
        width: 3.5in;
        margin-top: 24px;
        padding: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="name">Lexie Wilcox Photography pop-up</p>
    <p class="scan-heading">Scan to join the line</p>
    <div id="qr-box" class="qr-box"></div>
    <p id="join-url" class="join-url"></p>
    <button id="print-btn" class="print-btn" type="button">Print</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script type="module" src="qr.js?v=6"></script>
</body>
</html>
