<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lexie Wilcox Photography pop-up — Join the line</title>
  <meta name="description" content="Lexie Wilcox Photography pop-up. Join the line.">
  <style>
    :root {
      --paper: #fdf6ec;
      --paper-deep: #f6e6d0;
      --ink: #2a2018;
      --accent: #b4562a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, #fff9f0 0%, transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 30rem;
    }

    [hidden] {
      display: none !important;
    }

    .sun {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 34px;
    }

    .name {
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 64px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 26px auto;
    }

    .join-form {
      text-align: left;
    }

    .join-form label {
      display: block;
      font-family: Verdana, Geneva, sans-serif;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .join-form input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      color: var(--ink);
      background: #fffdf9;
      border: 2px solid var(--ink);
      border-radius: 12px;
      appearance: none;
      -webkit-appearance: none;
    }

    .join-form input:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .join-btn {
      width: 100%;
      height: 64px;
      margin-top: 18px;
      font-family: Verdana, Geneva, sans-serif;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.02em;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease;
    }

    .join-btn:hover,
    .join-btn:active {
      background: #9c461f;
    }

    .join-btn:focus {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .join-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .message {
      min-height: 26px;
      margin-top: 14px;
      font-family: Verdana, Geneva, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #7a2c12;
    }

    .my-place {
      text-align: center;
    }

    .mp-greeting {
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .mp-big {
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1.15;
      font-weight: bold;
    }

    .mp-line {
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      line-height: 1.6;
    }

    .mp-number {
      font-size: clamp(2rem, 9vw, 3rem);
      font-weight: bold;
      color: var(--accent);
    }

    .mp-error {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #7a2c12;
    }
  </style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <p class="name">Lexie Wilcox Photography pop-up</p>
    <div class="divider" aria-hidden="true"></div>

    <form id="join-form" class="join-form" novalidate>
      <label for="first-name">First name</label>
      <input id="first-name" name="firstName" type="text"
             autocomplete="given-name" autocapitalize="words" enterkeyhint="go"
             placeholder="e.g. Maya">
      <button type="submit" class="join-btn">Join</button>
      <p id="form-message" class="message" role="alert" aria-live="assertive"></p>
    </form>

    <section id="my-place" class="my-place" hidden aria-live="polite">
      <p id="mp-up-greeting" class="mp-greeting" hidden>Hi <span id="mp-up-name"></span></p>
      <h1 id="mp-up" class="mp-big" hidden>You&rsquo;re up!</h1>

      <p id="mp-waiting" class="mp-line" hidden>
        Hi <span id="mp-waiting-name"></span>, you&rsquo;re
        <span class="mp-number" id="mp-number"></span>
        in line.
      </p>

      <p id="mp-finding" class="mp-line" hidden>
        Hi <span id="mp-finding-name"></span>, finding your place&hellip;
      </p>

      <p id="mp-done" class="mp-line" hidden>
        Thanks for coming, <span id="mp-done-name"></span>!
      </p>

      <p id="mp-error" class="mp-error" hidden>We lost the connection. Please refresh the page.</p>
    </section>
  </main>

  <script type="module" src="join.js?v=5"></script>
</body>
</html>
