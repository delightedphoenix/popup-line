<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexie Wilcox Photography pop-up — Coming soon</title>
  <meta name="description" content="Lexie Wilcox Photography pop-up. Coming soon.">
  <style>
    :root {
      --paper: #fdf6ec;
      --paper-deep: #f6e6d0;
      --ink: #2a2018;
      --accent: #b4562a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, #fff9f0 0%, transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 30rem;
    }

    .sun {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 auto 34px;
    }

    .name {
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 64px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 26px auto;
    }

    h1 {
      font-size: clamp(3rem, 15vw, 6rem);
      line-height: 1.05;
      font-weight: bold;
    }

    .note {
      margin-top: 30px;
      font-family: Verdana, Geneva, sans-serif;
      font-size: clamp(1rem, 4vw, 1.15rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <p class="name">Lexie Wilcox Photography pop-up</p>
    <div class="divider" aria-hidden="true"></div>
    <h1>Coming soon</h1>
    <p class="note">We&rsquo;re getting everything ready for the pop-up. Check back soon.</p>
  </main>
</body>
</html>
